[project]
name = "sesam-dashboard"
version = "0.1.0"
description = "Operational dashboard for the Sesam OSS PoC pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "aiofiles>=24.0",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "typer>=0.9",
    "rich>=13.0",
]

[project.scripts]
sesam-dashboard = "sesam_dashboard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sesam_dashboard"]
