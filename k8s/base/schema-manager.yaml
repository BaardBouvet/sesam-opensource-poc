---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-manager
  namespace: sesam-poc
  labels:
    app: schema-manager
spec:
  replicas: 1
  strategy:
    type: Recreate          # single writer — no overlap during rollout
  selector:
    matchLabels:
      app: schema-manager
  template:
    metadata:
      labels:
        app: schema-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres-pgtrickle:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U inandout >/dev/null 2>&1; do
                sleep 2
              done
          envFrom:
            - secretRef:
                name: sesam-credentials
      containers:
        - name: schema-manager
          image: sesam-schema-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: health
              containerPort: 9080
          envFrom:
            - secretRef:
                name: sesam-credentials
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 9080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: mapping
              mountPath: /config/mapping.yaml
              subPath: mapping.yaml
            - name: connectors
              mountPath: /config/connectors
            - name: schema-manager-config
              mountPath: /config/schema-manager.yaml
              subPath: schema-manager.yaml
      volumes:
        - name: mapping
          configMap:
            name: osi-mapping-config
        - name: connectors
          configMap:
            name: inandout-connectors
        - name: schema-manager-config
          configMap:
            name: schema-manager-config
---
apiVersion: v1
kind: Service
metadata:
  name: schema-manager
  namespace: sesam-poc
  labels:
    app: schema-manager
spec:
  ports:
    - name: health
      port: 9080
      targetPort: 9080
  selector:
    app: schema-manager
