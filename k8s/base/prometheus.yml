global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: inandout-ingest
    static_configs:
      - targets:
          - inandout-ingest:9090
    metrics_path: /metrics

  - job_name: inandout-writeback
    static_configs:
      - targets:
          - inandout-writeback:9091
    metrics_path: /metrics
