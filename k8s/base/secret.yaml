# Placeholder secret — real values are injected by the overlay or sealed-secrets.
# Required keys:
#   POSTGRES_PASSWORD                  – PostgreSQL superuser password
#   INOUT_DATABASE_URL                 – full DSN used by schema-manager (DDL owner)
#   INGEST_DATABASE_URL                – restricted DSN for ingest (DML only)
#   WRITEBACK_DATABASE_URL             – restricted DSN for writeback (DML only)
#   INOUT_CREDENTIAL_HUBSPOT_OAUTH     – HubSpot OAuth token (any value for simulator)
#   INOUT_CREDENTIAL_TRIPLETEX_SESSION – Tripletex session token (any value for simulator)
apiVersion: v1
kind: Secret
metadata:
  name: sesam-credentials
  namespace: sesam-poc
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme"
  INOUT_DATABASE_URL: "postgresql://inandout:changeme@postgres:5432/inandout"
  INGEST_DATABASE_URL: "postgresql://sesam_ingest:changeme@postgres:5432/inandout"
  WRITEBACK_DATABASE_URL: "postgresql://sesam_writeback:changeme@postgres:5432/inandout"
  INOUT_CREDENTIAL_HUBSPOT_OAUTH: "dev-simulator-token"
  INOUT_CREDENTIAL_TRIPLETEX_SESSION: "dev-simulator-token"
