# Placeholder secret — real values are injected by the overlay or sealed-secrets.
# Required keys:
#   POSTGRES_PASSWORD     – PostgreSQL superuser password
#   INOUT_DATABASE_URL    – full DSN used by in-and-out engine
#   HUBSPOT_API_KEY       – HubSpot private-app token
#   TRIPLETEX_TOKEN       – Tripletex session token (consumer + employee token pair)
apiVersion: v1
kind: Secret
metadata:
  name: sesam-credentials
  namespace: sesam-poc
type: Opaque
stringData:
  POSTGRES_PASSWORD: "changeme"
  INOUT_DATABASE_URL: "postgresql://inandout:changeme@postgres:5432/inandout"
  HUBSPOT_API_KEY: "REPLACE_ME"
  TRIPLETEX_TOKEN: "REPLACE_ME"
