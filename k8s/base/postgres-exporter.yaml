# postgres_exporter — exposes pg_trickle and standard PostgreSQL metrics to Prometheus.
# Scrapes pgtrickle.pg_stat_stream_tables and pgtrickle.quick_health via custom queries.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: sesam-poc
  labels:
    app: postgres-exporter
spec:
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
  selector:
    app: postgres-exporter
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: sesam-poc
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.19.1
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sesam-credentials
                  key: POSTGRES_PASSWORD
            - name: DATA_SOURCE_NAME
              value: "postgresql://inandout:$(POSTGRES_PASSWORD)@postgres:5432/inandout?sslmode=disable"
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: /etc/postgres_exporter/queries
          ports:
            - name: metrics
              containerPort: 9187
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /metrics
              port: 9187
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres_exporter/queries
      volumes:
        - name: queries
          configMap:
            name: pg-trickle-exporter-queries
