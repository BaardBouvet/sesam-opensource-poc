# ConfigMap for in-and-out engine configs.
# Connector YAMLs (hubspot.yaml, tripletex.yaml) live in connectors/ at the
# repo root and are injected as the inandout-connectors ConfigMap via
# kustomization.yaml configMapGenerator.
apiVersion: v1
kind: ConfigMap
metadata:
  name: inandout-config
  namespace: sesam-poc
data:
  ingestion.yaml: |
    database:
      dsn: "${INGEST_DATABASE_URL}"
    connectors_dir: /connectors
    namespace: public
    health_server:
      listen: "0.0.0.0:9090"
    observability:
      logging:
        format: json
        level: info
      metrics:
        enabled: true
      tracing:
        enabled: false

  writeback.yaml: |
    database:
      dsn: "${WRITEBACK_DATABASE_URL}"
    connectors_dir: /connectors
    namespace: public
    health_server:
      listen: "0.0.0.0:9091"
    observability:
      logging:
        format: json
        level: info
      metrics:
        enabled: true
      tracing:
        enabled: false
