---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inandout-writeback
  namespace: sesam-poc
  labels:
    app: inandout-writeback
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inandout-writeback
  template:
    metadata:
      labels:
        app: inandout-writeback
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres-pgtrickle:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -U inandout >/dev/null 2>&1; do
                sleep 2
              done
          envFrom:
            - secretRef:
                name: sesam-credentials
        - name: wait-for-schema-manager
          image: curlimages/curl:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until curl -sf http://schema-manager:9080/ready >/dev/null 2>&1; do
                sleep 3
              done
      containers:
        - name: writeback
          image: inandout-engine:latest
          imagePullPolicy: IfNotPresent
          command: ["inandout", "writeback", "run", "--config", "/config/writeback.yaml"]
          ports:
            - name: health
              containerPort: 9091
          envFrom:
            - secretRef:
                name: sesam-credentials
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9091
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 9091
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: connectors
              mountPath: /connectors
      volumes:
        - name: config
          configMap:
            name: inandout-config
        - name: connectors
          configMap:
            name: inandout-connectors
---
apiVersion: v1
kind: Service
metadata:
  name: inandout-writeback
  namespace: sesam-poc
  labels:
    app: inandout-writeback
spec:
  ports:
    - name: health
      port: 9091
      targetPort: 9091
  selector:
    app: inandout-writeback
