apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sesam-poc

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - postgres.yaml
  - migrate-job.yaml
  - ingest.yaml
  - writeback.yaml
  - simulator.yaml

# Generate the OSI-mapping ConfigMap directly from the source file.
# Requires --load-restrictor=LoadRestrictionsNone (set in skaffold.yaml buildArgs)
# so kustomize can read a file above the k8s/ directory.
configMapGenerator:
  - name: osi-mapping-config
    namespace: sesam-poc
    options:
      disableNameSuffixHash: true
    files:
      - mapping.yaml=../../mappings/mapping.yaml

commonLabels:
  app.kubernetes.io/part-of: sesam-poc
  app.kubernetes.io/managed-by: kustomize
