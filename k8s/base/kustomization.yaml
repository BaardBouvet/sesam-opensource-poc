apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sesam-poc

resources:
  - namespace.yaml
  - secret.yaml
  - configmap.yaml
  - postgres.yaml
  - schema-manager.yaml
  - ingest.yaml
  - writeback.yaml
  - simulator.yaml
  - dashboard.yaml
  - observability.yaml

# Generate ConfigMaps directly from source files.
# Requires --load-restrictor=LoadRestrictionsNone (set in skaffold.yaml buildArgs)
# so kustomize can read files above the k8s/ directory.
configMapGenerator:
  - name: osi-mapping-config
    namespace: sesam-poc
    options:
      disableNameSuffixHash: true
    files:
      - mapping.yaml=../../mapping.yaml

  - name: inandout-connectors
    namespace: sesam-poc
    options:
      disableNameSuffixHash: true
    files:
      - hubspot.yaml=../../connectors/hubspot.yaml
      - tripletex.yaml=../../connectors/tripletex.yaml

  - name: schema-manager-config
    namespace: sesam-poc
    options:
      disableNameSuffixHash: true
    files:
      - schema-manager.yaml=../../vendor/schema-manager/schema-manager.yaml

  - name: prometheus-config
    namespace: sesam-poc
    options:
      disableNameSuffixHash: true
    files:
      - prometheus.yml=prometheus.yml
      - alerts.yml=../../vendor/in-and-out/observability/prometheus/alerts.yml

  - name: alertmanager-config
    namespace: sesam-poc
    options:
      disableNameSuffixHash: true
    files:
      - alertmanager.yml=../../vendor/in-and-out/observability/alertmanager.yml

  - name: grafana-dashboards
    namespace: sesam-poc
    options:
      disableNameSuffixHash: true
    files:
      - inandout.json=../../vendor/in-and-out/observability/grafana/dashboards/inandout.json

  - name: grafana-provisioning-datasources
    namespace: sesam-poc
    options:
      disableNameSuffixHash: true
    files:
      - prometheus.yml=../../vendor/in-and-out/observability/grafana/provisioning/datasources/prometheus.yml

  - name: grafana-provisioning-dashboards
    namespace: sesam-poc
    options:
      disableNameSuffixHash: true
    files:
      - dashboard.yml=../../vendor/in-and-out/observability/grafana/provisioning/dashboards/dashboard.yml

labels:
  - pairs:
      app.kubernetes.io/part-of: sesam-poc
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
