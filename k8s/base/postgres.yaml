# PostgreSQL StatefulSet with pg_trickle pre-installed.
# The image is built from vendor/pg-trickle/Dockerfile.hub by Skaffold.
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sesam-poc
  labels:
    app: postgres
spec:
  clusterIP: None # headless for StatefulSet stable DNS
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sesam-poc
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres-pgtrickle:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "shared_preload_libraries=pg_trickle"
            - "-c"
            - "max_worker_processes=16"
            - "-c"
            - "max_locks_per_transaction=1024"
            - "-c"
            - "pg_trickle.cdc_mode=trigger"
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: inandout
            - name: POSTGRES_USER
              value: inandout
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sesam-credentials
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "inandout", "-d", "inandout"]
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
