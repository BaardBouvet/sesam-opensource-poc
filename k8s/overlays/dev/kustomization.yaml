apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sesam-poc

bases:
  - ../../base

# Dev overlay: lower resource limits so the cluster fits in a devcontainer.
patches:
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
    target:
      kind: StatefulSet
      name: postgres

  # Keep single replicas explicit for local dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment

  # Point connectors at the local simulator instead of production APIs.
  # The engine reads INOUT_<NAME>_BASE_URL and prefers it over connector.connection.base_url.
  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: INOUT_HUBSPOT_BASE_URL
            value: "http://inandout-simulator:6100/connectors/hubspot"
          - name: INOUT_TRIPLETEX_BASE_URL
            value: "http://inandout-simulator:6100/connectors/tripletex"
    target:
      kind: Deployment
      name: inandout-ingest

  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: INOUT_HUBSPOT_BASE_URL
            value: "http://inandout-simulator:6100/connectors/hubspot"
          - name: INOUT_TRIPLETEX_BASE_URL
            value: "http://inandout-simulator:6100/connectors/tripletex"
    target:
      kind: Deployment
      name: inandout-writeback

# Direct postgres access is handled by `skaffold dev` portForward rules
# (localhost:5432 → pod port 5432) — no NodePort needed in dev.
