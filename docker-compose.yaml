# docker-compose.yaml — local dev stack without Kubernetes.
#
# Usage:
#   docker compose up --build
#
# Startup order (enforced by depends_on + healthcheck):
#   1. postgres          (wait for pg_isready)
#   2. schema-manager    (runs Alembic + creates stream tables, then stays running)
#   3. simulator         (mock HubSpot/Tripletex APIs)
#   4. ingest            (waits for alembic_version via retry backoff)
#   5. writeback         (same retry backoff)
#
# Port mapping:
#   localhost:5432  → postgres
#   localhost:6100  → simulator
#   localhost:9080  → schema-manager health
#   localhost:9090  → ingest health
#   localhost:9091  → writeback health

x-common-env: &common-env
  POSTGRES_PASSWORD: changeme
  INOUT_DATABASE_URL: "postgresql://inandout:changeme@postgres:5432/inandout"
  INGEST_DATABASE_URL: "postgresql://inandout:changeme@postgres:5432/inandout"
  WRITEBACK_DATABASE_URL: "postgresql://inandout:changeme@postgres:5432/inandout"

services:
  # ── PostgreSQL with pg_trickle ────────────────────────────────────────────
  postgres:
    build:
      context: vendor/pg-trickle
      dockerfile: Dockerfile.hub
    environment:
      POSTGRES_DB: inandout
      POSTGRES_USER: inandout
      POSTGRES_PASSWORD: changeme
    command:
      - "-c"
      - "shared_preload_libraries=pg_trickle"
      - "-c"
      - "max_worker_processes=16"
      - "-c"
      - "max_locks_per_transaction=1024"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inandout -d inandout"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ── Schema manager ───────────────────────────────────────────────────────
  schema-manager:
    build:
      context: .
      dockerfile: docker/schema-manager.Dockerfile
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9080:9080"
    volumes:
      - ./mapping.yaml:/config/mapping.yaml:ro
      - ./connectors:/config/connectors:ro
      - ./vendor/schema-manager/schema-manager.yaml:/config/schema-manager.yaml:ro

  # ── Simulator (mock external APIs) ───────────────────────────────────────
  simulator:
    build:
      context: vendor/in-and-out
      dockerfile: simulator/Dockerfile
    ports:
      - "6100:6100"

  # ── Ingest ───────────────────────────────────────────────────────────────
  ingest:
    build:
      context: vendor/in-and-out
      dockerfile: engine/Dockerfile
    command:
      ["inandout", "ingest", "run", "--config", "/config/ingestion.yaml"]
    environment:
      <<: *common-env
      INOUT_CREDENTIAL_HUBSPOT_OAUTH: dev-simulator-token
      INOUT_CREDENTIAL_TRIPLETEX_SESSION: dev-simulator-token
    depends_on:
      postgres:
        condition: service_healthy
      schema-manager:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./connectors:/connectors:ro
      - ./docker/compose-configs/ingestion.yaml:/config/ingestion.yaml:ro

  # ── Writeback ────────────────────────────────────────────────────────────
  writeback:
    build:
      context: vendor/in-and-out
      dockerfile: engine/Dockerfile
    command:
      ["inandout", "writeback", "run", "--config", "/config/writeback.yaml"]
    environment:
      <<: *common-env
      INOUT_CREDENTIAL_HUBSPOT_OAUTH: dev-simulator-token
      INOUT_CREDENTIAL_TRIPLETEX_SESSION: dev-simulator-token
    depends_on:
      postgres:
        condition: service_healthy
      schema-manager:
        condition: service_started
    ports:
      - "9091:9091"
    volumes:
      - ./connectors:/connectors:ro
      - ./docker/compose-configs/writeback.yaml:/config/writeback.yaml:ro

volumes:
  pgdata:
