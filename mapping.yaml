version: "1.0"
description: >
  OSI mapping for the HubSpot ↔ Tripletex two-way sync PoC.
  Covers person, company, and person_company_association.

sources:
  hubspot_contacts:
    primary_key: hs_object_id
  tripletex_contacts:
    primary_key: id
  hubspot_companies:
    primary_key: hs_object_id
  tripletex_customers:
    primary_key: id
  hubspot_associations:
    primary_key: [contact_id, company_id]

targets:
  person:
    fields:
      email: identity
      first_name:
        strategy: coalesce
        group: name
      last_name:
        strategy: coalesce
        group: name
      phone: last_modified
      address:
        strategy: coalesce
        group: addr
      city:
        strategy: coalesce
        group: addr

  company:
    fields:
      org_number: identity
      domain:
        strategy: identity
        link_group: domain_match
      name: coalesce
      phone: last_modified
      address:
        strategy: coalesce
        group: addr
      city:
        strategy: coalesce
        group: addr

  person_company_association:
    fields:
      person_id:
        strategy: identity
        references: person
        link_group: assoc
      company_id:
        strategy: identity
        references: company
        link_group: assoc
      relation_type: coalesce

mappings:
  - name: hubspot_contacts
    source: hubspot_contacts
    target: person
    last_modified: lastmodifieddate
    fields:
      - source: email
        target: email
      - source: firstname
        target: first_name
        priority: 1
      - source: lastname
        target: last_name
        priority: 1
      - source: phone
        target: phone
      - source: address
        target: address
        priority: 2
      - source: city
        target: city
        priority: 2

  - name: tripletex_contacts
    source: tripletex_contacts
    target: person
    last_modified: last_modified_date
    fields:
      - source: email
        target: email
      - source: first_name
        target: first_name
        priority: 2
      - source: last_name
        target: last_name
        priority: 2
      - source: phone_number_mobile
        target: phone
      - source: address
        target: address
        priority: 1
      - source: city
        target: city
        priority: 1

  - name: hubspot_companies
    source: hubspot_companies
    target: company
    last_modified: lastmodifieddate
    fields:
      - source: org_number
        target: org_number
      - source: domain
        target: domain
      - source: name
        target: name
        priority: 1
      - source: phone
        target: phone
      - source: address
        target: address
        priority: 2
      - source: city
        target: city
        priority: 2

  - name: tripletex_customers
    source: tripletex_customers
    target: company
    last_modified: last_modified_date
    fields:
      - source: organisation_number
        target: org_number
      - source: url
        target: domain
        expression: "regexp_replace(url, '^https?://(www\\.)?', '')"
        reverse_expression: "'https://' || domain"
      - source: name
        target: name
        priority: 2
      - source: phone_number
        target: phone
      - source: postal_address_address
        target: address
        priority: 1
      - source: postal_address_city
        target: city
        priority: 1

  - name: hubspot_associations
    source: hubspot_associations
    target: person_company_association
    fields:
      - source: contact_id
        target: person_id
      - source: company_id
        target: company_id
      - source: association_type
        target: relation_type
        priority: 1

  - name: tripletex_contact_assoc
    source: tripletex_contacts
    target: person_company_association
    filter: "customer_id IS NOT NULL"
    fields:
      - source: id
        target: person_id
      - source: customer_id
        target: company_id
      - target: relation_type
        expression: "'employee'"
        direction: forward_only
        priority: 2
