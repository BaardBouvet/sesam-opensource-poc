version: "1.0"
description: >
  OSI mapping for the HubSpot ↔ Tripletex two-way sync PoC.
  Covers person, company, and person_company_association.
  Sources point at in-and-out inout_src_* tables; fields are accessed
  via source_path into the data jsonb column (e.g. source_path: data.properties.firstname).

sources:
  hubspot_contacts:
    primary_key: external_id
    table: inout_src_hubspot_contacts
  tripletex_contacts:
    primary_key: external_id
    table: inout_src_tripletex_contacts
  hubspot_companies:
    primary_key: external_id
    table: inout_src_hubspot_companies
  tripletex_customers:
    primary_key: external_id
    table: inout_src_tripletex_customers
  hubspot_associations:
    primary_key: external_id
    table: inout_src_hubspot_contacts_companies_associations

targets:
  person:
    fields:
      email: identity
      first_name:
        strategy: coalesce
        group: name
      last_name:
        strategy: coalesce
        group: name
      phone: last_modified
      address:
        strategy: coalesce
        group: addr
      city:
        strategy: coalesce
        group: addr

  company:
    fields:
      org_number: identity
      domain:
        strategy: identity
        link_group: domain_match
      name: coalesce
      phone: last_modified
      address:
        strategy: coalesce
        group: addr
      city:
        strategy: coalesce
        group: addr

  person_company_association:
    fields:
      person_id:
        strategy: identity
        references: person
        link_group: assoc
      company_id:
        strategy: identity
        references: company
        link_group: assoc
      relation_type: coalesce

mappings:
  - name: hubspot_contacts
    source: hubspot_contacts
    target: person
    last_modified:
      expression: "data->'properties'->>'lastmodifieddate'"
    written_state:
      table: inout_dst_hubspot_contacts_lwstate
      cluster_id: cluster_id
      written: _written
      written_at: _written_at
    derive_timestamps: true
    fields:
      - source_path: data.properties.email
        target: email
      - source_path: data.properties.firstname
        target: first_name
        priority: 1
      - source_path: data.properties.lastname
        target: last_name
        priority: 1
      - source_path: data.properties.phone
        target: phone

  - name: tripletex_contacts
    source: tripletex_contacts
    target: person
    last_modified:
      expression: "data->>'changesUntil'"
    written_state:
      table: inout_dst_tripletex_contacts_lwstate
      cluster_id: cluster_id
      written: _written
      written_at: _written_at
    derive_timestamps: true
    fields:
      - source_path: data.email
        target: email
      - source_path: data.firstName
        target: first_name
        priority: 2
      - source_path: data.lastName
        target: last_name
        priority: 2
      - source_path: data.phoneNumberMobile
        target: phone

  - name: hubspot_companies
    source: hubspot_companies
    target: company
    last_modified:
      expression: "data->'properties'->>'lastmodifieddate'"
    written_state:
      table: inout_dst_hubspot_companies_lwstate
      cluster_id: cluster_id
      written: _written
      written_at: _written_at
    derive_timestamps: true
    fields:
      - source_path: data.properties.domain
        target: domain
      - source_path: data.properties.name
        target: name
        priority: 1
      - source_path: data.properties.phone
        target: phone

  - name: tripletex_customers
    source: tripletex_customers
    target: company
    last_modified:
      expression: "data->>'changesUntil'"
    written_state:
      table: inout_dst_tripletex_customers_lwstate
      cluster_id: cluster_id
      written: _written
      written_at: _written_at
    derive_timestamps: true
    fields:
      - source_path: data.organizationNumber
        target: org_number
      - source_path: data.name
        target: name
        priority: 2
      - source_path: data.phoneNumber
        target: phone
      - source_path: data.deliveryAddress.addressLine1
        target: address
        priority: 1
      - source_path: data.deliveryAddress.city
        target: city
        priority: 1

  - name: hubspot_associations
    source: hubspot_associations
    target: person_company_association
    written_state:
      table: inout_dst_hubspot_associations_lwstate
      cluster_id: cluster_id
      written: _written
      written_at: _written_at
    fields:
      - source_path: data.fromObjectId
        target: person_id
      - expression: "(data->'to'->0->>'id')"
        target: company_id
      - expression: "(data->'to'->0->>'type')"
        target: relation_type
        priority: 1

  - name: tripletex_contact_assoc
    parent: tripletex_contacts
    target: person_company_association
    filter: "data->>'customer' IS NOT NULL"
    fields:
      - source: external_id
        target: person_id
        direction: forward_only
      - expression: "(data->'customer'->>'id')"
        target: company_id
      - target: relation_type
        expression: "'employee'"
        direction: forward_only
        priority: 2
