apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: sesam-poc

build:
  local:
    push: false # load directly into kind — no registry needed
    useBuildkit: true
  artifacts:
    # ── in-and-out engine (ingest + writeback + migrate) ─────────────────────
    - image: inandout-engine
      context: vendor/in-and-out
      docker:
        dockerfile: engine/Dockerfile
      sync:
        # Hot-reload Python source during `skaffold dev`
        manual:
          - src: "engine/src/**/*.py"
            dest: /app/src

    # ── in-and-out simulator ─────────────────────────────────────────────────
    - image: inandout-simulator
      context: vendor/in-and-out
      docker:
        dockerfile: simulator/Dockerfile

    # ── PostgreSQL + pg_trickle ───────────────────────────────────────────────
    - image: postgres-pgtrickle
      context: vendor/pg-trickle
      docker:
        dockerfile: Dockerfile.hub

    # ── OSI-mapping engine (Rust CLI + matview conversion script) ─────────────
    # Context is the workspace root so both vendor/osi-mapping and
    # vendor/pg-trickle/scripts are accessible in the build.
    - image: osi-mapping-engine
      context: .
      docker:
        dockerfile: docker/osi-mapping.Dockerfile

    # ── Schema-manager (DDL lifecycle supervisor) ─────────────────────────────
    # Context is the workspace root so vendor/ subdirectories, mapping.yaml,
    # and connectors/ are all accessible.
    - image: sesam-schema-manager
      context: .
      docker:
        dockerfile: docker/schema-manager.Dockerfile
      requires:
        - image: osi-mapping-engine
          alias: OSI_MAPPING_ENGINE
        - image: inandout-engine
          alias: INANDOUT_ENGINE
      sync:
        manual:
          - src: "vendor/schema-manager/schema_manager/**/*.py"
            dest: /usr/local/lib/python3.13/site-packages
            strip: "vendor/schema-manager/"
          # mapping.yaml and connectors/*.yaml are mounted from ConfigMaps
          # (read-only). Changes to those files trigger a full kustomize
          # redeploy which regenerates the ConfigMaps — file sync is not used.

    # ── Sesam Dashboard (operational UI) ─────────────────────────────────────
    - image: sesam-dashboard
      context: .
      docker:
        dockerfile: docker/dashboard.Dockerfile
      sync:
        manual:
          - src: "dashboard/src/**/*.py"
            dest: /usr/local/lib/python3.13/site-packages
            strip: "dashboard/src/"
          - src: "dashboard/src/**/templates/**"
            dest: /usr/local/lib/python3.13/site-packages
            strip: "dashboard/src/"

manifests:
  kustomize:
    paths:
      - k8s/overlays/dev
    buildArgs:
      - --load-restrictor=LoadRestrictionsNone

deploy:
  kubeContext: kind-sesam-poc # kind cluster created by `just cluster-create`

# Port-forward from the kind cluster to localhost inside the devcontainer.
portForward:
  - resourceType: StatefulSet
    resourceName: postgres
    namespace: sesam-poc
    port: 5432
    localPort: 5432
  - resourceType: Service
    resourceName: sesam-dashboard
    namespace: sesam-poc
    port: 8888
    localPort: 8888
  - resourceType: Service
    resourceName: grafana
    namespace: sesam-poc
    port: 3000
    localPort: 3000
  - resourceType: Service
    resourceName: prometheus
    namespace: sesam-poc
    port: 9090
    localPort: 9095 # avoids collision with ingest's 9090 forward

  - resourceType: Service
    resourceName: inandout-simulator
    namespace: sesam-poc
    port: 6100
    localPort: 6100

  - resourceType: Service
    resourceName: inandout-ingest
    namespace: sesam-poc
    port: 9090
    localPort: 9090

  - resourceType: Service
    resourceName: inandout-writeback
    namespace: sesam-poc
    port: 9091
    localPort: 9091

  - resourceType: Service
    resourceName: schema-manager
    namespace: sesam-poc
    port: 9080
    localPort: 9080
